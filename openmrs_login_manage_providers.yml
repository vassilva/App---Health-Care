appId: org.openmrs.mobile
name: "OpenMRS - Login + Manage Providers + Logout Confirm"

onFlowFail:
  - takeScreenshot: "failure_openmrs"

---

# Login

- launchApp
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "LOGIN"
    timeout: 30000

# If ONLINE -> turn off
- runFlow:
    when:
      visible: "Online"
    commands:
      - tapOn:
          point: "70%,70%"

# Ensure it is OFFLINE
- extendedWaitUntil:
    visible: "Offline"
    timeout: 5000

- tapOn:
    text: ".*Username.*"
- inputText: "admin"

- tapOn:
    text: ".*Password.*"
- inputText: "Admin123"

- tapOn:
    text: ".*Session Location.*"

- extendedWaitUntil:
    visible: "Mobile Clinic"
    timeout: 30000
- tapOn:
    text: "Mobile Clinic"

- assertVisible:
    text: "Mobile Clinic"

- tapOn:
    text: "LOGIN"

# Dashboard

- extendedWaitUntil:
    visible: "Find Patients"
    timeout: 30000

# Provider Manager

- tapOn:
    text: "Manage Providers"

- extendedWaitUntil:
    visible: "Provider Manager"
    timeout: 30000

- assertVisible:
    text: "No providers found."

# Logout

- tapOn:
    point: "96%,7%"

- extendedWaitUntil:
    visible: "Logout admin"
    timeout: 30000
- tapOn:
    text: "Logout admin"

# Logout confirmation

- extendedWaitUntil:
    visible: "Logging out"
    timeout: 30000

- assertVisible:
    text: "Are you sure you want to logout from OpenMRS client?"

- tapOn:
    text: "LOGOUT"

# Final validation

- extendedWaitUntil:
    visible: "LOGIN"
    timeout: 30000

- stopApp